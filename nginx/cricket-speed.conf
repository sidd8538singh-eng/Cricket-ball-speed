# ==============================================================================
# Nginx Reverse Proxy Configuration for Cricket Ball Speed Analyzer
# Install to: /etc/nginx/sites-available/cricket-speed
# Enable: ln -s /etc/nginx/sites-available/cricket-speed /etc/nginx/sites-enabled/
# ==============================================================================

upstream cricket_speed_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;  # Replace with your domain (e.g. cricket.yourdomain.com) or droplet IP

    # Allow large video uploads (up to 500MB)
    client_max_body_size 500M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/json application/javascript;

    # Proxy all traffic to FastAPI backend
    location / {
        proxy_pass http://cricket_speed_backend;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for long-running computer vision / trajectory processing
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Buffer settings
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Static assets caching
    location /static/ {
        proxy_pass http://cricket_speed_backend/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Health check endpoint
    location /health {
        proxy_pass http://cricket_speed_backend/health;
        access_log off;
    }
}
